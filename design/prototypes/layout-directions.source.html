      <div class="co-editor-tools"><div class="co-tabs" aria-label="编辑视图"><button type="button" data-view="script" class="cursor-interaction">文稿</button><button type="button" data-view="storyboard" class="cursor-interaction">分镜</button><button type="button" data-view="timeline" class="cursor-interaction">时间线</button></div><div class="co-subtle"><i data-lucide="magnet" aria-hidden="true"></i> 吸附开启</div></div>
      <div class="co-editor-view co-tracks" data-panel="timeline">
        <div class="co-ruler"><span>00:00</span><span>00:15</span><span>00:30</span><span>00:45</span><span>01:00</span><span>01:15</span></div>
        <div class="co-track"><span class="co-track-name">画面</span><div class="co-track-lane"><button type="button" class="co-clip cursor-interaction" data-shot="01" style="flex:1.1">海岸航拍</button><button type="button" class="co-clip is-current cursor-interaction" data-shot="03" style="flex:1.8">沿海公路</button><button type="button" class="co-clip cursor-interaction" data-shot="04" style="flex:1.4">山间晨雾</button><button type="button" class="co-clip cursor-interaction" data-shot="05">落日</button><span class="co-cutline"></span></div></div>
        <div class="co-track"><span class="co-track-name">字幕</span><div class="co-track-lane captions"><span class="co-clip">出发</span><span class="co-clip" style="flex:2">沿着海岸，慢一点。</span><span class="co-clip">看见远方</span></div></div>
        <div class="co-track"><span class="co-track-name">旁白</span><div class="co-track-lane audio"><span class="co-clip">旁白 · 第 2 版</span></div></div>
        <div class="co-track"><span class="co-track-name">音乐</span><div class="co-track-lane audio"><span class="co-clip">海风 · −18 dB</span></div></div>
      </div>
      <div class="co-editor-view co-storyboard" data-panel="storyboard" hidden>
        <button type="button" class="co-shot cursor-interaction" data-shot="01"><div class="co-thumb"></div><span>01 海岸航拍</span><div class="co-subtle">开场 · 8 秒</div></button>
        <button type="button" class="co-shot cursor-interaction" data-shot="03"><div class="co-thumb alt"></div><span>03 沿海公路</span><div class="co-subtle">行进 · 12 秒</div></button>
        <button type="button" class="co-shot cursor-interaction" data-shot="04"><div class="co-thumb"></div><span>04 山间晨雾</span><div class="co-subtle">停留 · 10 秒</div></button>
        <button type="button" class="co-shot cursor-interaction" data-shot="05"><div class="co-thumb alt"></div><span>05 落日</span><div class="co-subtle">结尾 · 已锁定</div></button>
      </div>
      <div class="co-editor-view co-script" data-panel="script" hidden><div class="co-script-line"><span>00:08</span><span>有些风景，需要慢下来才看得见。</span></div><div class="co-script-line selected"><span>00:24</span><span>沿着海岸，慢一点。</span></div><div class="co-script-line"><span>00:38</span><span>拐过下一个弯，山就出现了。</span></div></div>
    </section>
    <aside class="co-agent" aria-label="Agent 协作区">
      <div class="co-agent-head"><span class="co-agent-title"><i data-lucide="sparkles" aria-hidden="true"></i> 剪辑助手</span><button class="co-pause cursor-interaction" type="button">暂停</button></div>
      <div class="co-agent-request">开头再紧凑些，保留公路镜头里的呼吸感。</div>
      <div class="co-agent-status"><span class="co-state-dot"></span><span class="co-status-text">正在调整开头的节奏</span></div>
      <div class="co-steps"><div class="co-step"><i data-lucide="check" aria-hidden="true"></i> 已缩短开场 3.2 秒</div><div class="co-step"><i data-lucide="check" aria-hidden="true"></i> 已同步字幕与旁白</div><div class="co-step"><i data-lucide="circle" aria-hidden="true"></i> 检查镜头衔接</div></div>
      <div class="co-result"><div><div class="co-result-title">开场修改</div><div class="co-result-details">00:00—00:18 · 3 处变化</div></div><button class="co-preview cursor-interaction" type="button">查看变化</button></div>
      <div class="co-protected"><i data-lucide="lock-keyhole" aria-hidden="true"></i><span class="co-protection-text">结尾镜头已锁定</span></div>
      <div class="co-composer"><div class="co-reference"><i data-lucide="film" aria-hidden="true"></i><span class="co-ref-text">镜头 03 · 沿海公路</span></div><input class="co-message" aria-label="补充剪辑意见" placeholder="继续描述你的想法…"><div class="co-composer-bottom"><span class="co-subtle">仅修改选中镜头</span><button class="co-send cursor-interaction" type="button" aria-label="提交示例意见"><i data-lucide="arrow-up" aria-hidden="true"></i></button></div></div>
    </aside>
    <footer class="co-footer"><span class="co-footer-message" aria-live="polite">工作台交互草图</span><span>本地工程 · 1080p</span></footer>
  </template>
  <script>
    (() => {
      const root = document.getElementById('cocraft-directions');
      const template = document.getElementById('co-workspace-template');
      const settings = { appearance:'auto', accent:'#6384b8', agentWidth:250 };
      const saved = window.openai && window.openai.widgetState;
      if (saved && saved.privateContent && saved.privateContent.settings) Object.assign(settings, saved.privateContent.settings);
      const windows = [...root.querySelectorAll('.co-window')];
      const names = { '01':'海岸航拍', '03':'沿海公路', '04':'山间晨雾', '05':'落日' };
      const lines = { '01':'有些风景，需要慢下来。', '03':'沿着海岸，慢一点。', '04':'拐过下一个弯，山就出现了。', '05':'把这一刻，留久一点。' };
      function save() {
        if (window.openai && window.openai.setWidgetState) window.openai.setWidgetState({ modelContent:{ theme:settings.appearance, accent:settings.accent, agentPanelWidth:settings.agentWidth },privateContent:{settings} }).catch(()=>{});
      }
      function applySettings() {
        windows.forEach(win=>{
          win.style.colorScheme = settings.appearance === 'auto' ? 'inherit' : settings.appearance;
          win.style.setProperty('--co-accent',settings.accent);
          win.style.setProperty('--agent-width',settings.agentWidth+'px');
        });
      }
      windows.forEach(win=>{
        win.appendChild(template.content.cloneNode(true));
        let currentShot='03'; let paused=false; let locked=false; let comparison=false;
        const lockedShots=new Set(['05']);
        win.querySelectorAll('[data-shot]').forEach(item=>{item.classList.toggle('is-current',item.dataset.shot===currentShot);item.classList.toggle('is-locked',lockedShots.has(item.dataset.shot));});
        const note = text => {win.querySelector('.co-footer-message').textContent=text;};
        function setView(view) {
          win.querySelectorAll('[data-panel]').forEach(panel=>panel.hidden=panel.dataset.panel!==view);
          win.querySelectorAll('.co-tabs button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.view===view)));
        }
        setView(win.dataset.view);
        win.querySelectorAll('.co-tabs button').forEach(button=>button.addEventListener('click',()=>setView(button.dataset.view)));
        win.querySelectorAll('[data-shot]').forEach(button=>button.addEventListener('click',()=>{
          currentShot=button.dataset.shot;
          win.querySelectorAll('[data-shot]').forEach(item=>item.classList.toggle('is-current',item.dataset.shot===currentShot));
          win.querySelector('.co-viewer-name').textContent='当前版本 · 镜头 '+currentShot;
          win.querySelector('.co-frame-text').textContent=lines[currentShot];
          win.querySelector('.co-ref-text').textContent='镜头 '+currentShot+' · '+names[currentShot];
          locked=lockedShots.has(currentShot);
          win.querySelector('.co-lock').setAttribute('aria-pressed',String(locked));
          win.querySelector('.co-lock').textContent=locked?'已锁定':'锁定';
          win.querySelector('.co-lock').setAttribute('aria-label',locked?'解除当前镜头锁定':'锁定当前镜头');
          note('已选择镜头 '+currentShot+' · 可直接补充修改意见');
        }));
        win.querySelector('.co-search').addEventListener('input',event=>{
          const q=event.target.value.trim();
          win.querySelectorAll('.co-asset').forEach(item=>item.hidden=!item.dataset.name.includes(q));
        });
        win.querySelector('.co-pause').addEventListener('click',event=>{
          paused=!paused; event.currentTarget.textContent=paused?'继续':'暂停';
          win.querySelector('.co-status-text').textContent=paused?'已暂停 · 可以直接手动修改':'正在调整开头的节奏';
          note(paused?'Agent 已暂停，已完成的修改保留':'Agent 根据当前工程继续');
        });
        win.querySelector('.co-lock').addEventListener('click',event=>{
          locked=!locked; event.currentTarget.setAttribute('aria-pressed',String(locked));
          if(locked)lockedShots.add(currentShot); else lockedShots.delete(currentShot);
          event.currentTarget.textContent=locked?'已锁定':'锁定';
          event.currentTarget.setAttribute('aria-label',locked?'解除当前镜头锁定':'锁定当前镜头');
          win.querySelectorAll('[data-shot]').forEach(item=>{if(item.dataset.shot===currentShot)item.classList.toggle('is-locked',locked);});
          win.querySelector('.co-protection-text').textContent=locked?'镜头 '+currentShot+' 已锁定':'结尾镜头已锁定';
          note(locked?'当前镜头已锁定，Agent 将保留你的选择':'当前镜头已解除锁定');
        });
        const compare = ()=>{
          comparison=!comparison;
          win.querySelector('.co-compare').setAttribute('aria-pressed',String(comparison));
          win.querySelector('.co-viewer-name').textContent=comparison?'上一版 · 开头 18.0 秒':'当前版本 · 开头 14.8 秒';
          note(comparison?'正在对比上一版；再次点击回到当前版本':'已回到当前版本 · 开头缩短 3.2 秒');
        };
        win.querySelector('.co-compare').addEventListener('click',compare);
        win.querySelectorAll('.co-preview').forEach(button=>button.addEventListener('click',compare));
        function send(){
          const input=win.querySelector('.co-message');
          if(!input.value.trim()) {input.focus(); return;}
          win.querySelector('.co-agent-request').textContent=input.value.trim();
          note('示例意见已关联镜头 '+currentShot+'，未执行真实剪辑'); input.value='';
        }
        win.querySelector('.co-send').addEventListener('click',send);
        win.querySelector('.co-message').addEventListener('keydown',event=>{if(event.key==='Enter')send();});
      });
      applySettings();
      if(globalThis.lucide) lucide.createIcons({ attrs:{width:15,height:15} });
      if(globalThis.Tweak){
        const tweak=new Tweak({container:root,onChange:()=>{applySettings();save();}});
        tweak.addSelect(settings,'appearance',{label:'明暗模式',options:[{label:'跟随系统',value:'auto'},{label:'浅色',value:'light'},{label:'深色',value:'dark'}]});
        tweak.addColorPicker(settings,'accent',{label:'选中与工作状态强调色',reference:'--co-accent'});
        tweak.addSlider(settings,'agentWidth',{label:'Agent 面板宽度',min:230,max:300,step:10,unit:'px'});
      }
      window.addEventListener('openai:set_globals',event=>{
        const state=event.detail && event.detail.globals && event.detail.globals.widgetState;
        if(state && state.privateContent && state.privateContent.settings){Object.assign(settings,state.privateContent.settings); applySettings();}
      });
    })();
  </script>
</div>
