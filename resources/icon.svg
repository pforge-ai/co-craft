<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <!-- Native macOS Sequoia 824x824 continuous superellipse (x:100..924, y:100..924) -->
    <path id="squircle" d="
      M 310 100
      H 714
      C 792 100, 836 100, 868 122
      C 902 145, 924 189, 924 267
      V 757
      C 924 835, 902 879, 868 902
      C 836 924, 792 924, 714 924
      H 310
      C 232 924, 188 924, 156 902
      C 122 879, 100 835, 100 757
      V 267
      C 100 189, 122 145, 156 122
      C 188 100, 232 100, 310 100
      Z
    "/>

    <clipPath id="squircle-clip">
      <use href="#squircle"/>
    </clipPath>

    <!-- Pure luminous porcelain base -->
    <linearGradient id="tile-bg" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.68" stop-color="#FAFBFD"/>
      <stop offset="1" stop-color="#EEF2F9"/>
    </linearGradient>

    <radialGradient id="tile-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 512) scale(380)">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#F472B6" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="tile-rim" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#CBD5E1" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#94A3B8" stop-opacity="0.5"/>
    </linearGradient>

    <!--
      Original CoCraft Twin-Aperture Mark ("Co" = Dual Interlocking Prism Arcs):
      Two clean, architectural, thick rounded C-frames offset in 3D space and rotated slightly in opposite harmony,
      creating an unmistakable double-C / Cinema Lens Aperture with pure Apple-grade optical glass intersection.
      Zero bumpy joints, zero blurry airbrush tubes — pure geometric clarity at 16px and 1024px!
    -->
    <!-- Back C-Arc ("Creation" — Warm Amber -> Peach Coral -> Rose Magenta), shifted upper-left -->
    <path id="arc-warm" fill-rule="evenodd" clip-rule="evenodd" d="
      M 454 228
      H 626
      C 666 228, 698 260, 698 300
      C 698 340, 666 372, 626 372
      H 458
      C 402 372, 368 406, 368 462
      V 494
      C 368 550, 402 584, 458 584
      H 576
      C 616 584, 648 616, 648 656
      C 648 696, 616 728, 576 728
      H 454
      C 314 728, 224 638, 224 498
      V 458
      C 224 318, 314 228, 454 228
      Z
    " transform="rotate(-8 461 478)"/>

    <!-- Front C-Arc ("Craft & Stage" — Sunlit Mint -> Electric Sky -> Cobalt -> Periwinkle), shifted lower-right -->
    <path id="arc-cool" fill-rule="evenodd" clip-rule="evenodd" d="
      M 570 296
      H 728
      C 768 296, 800 328, 800 368
      C 800 408, 768 440, 728 440
      H 574
      C 518 440, 484 474, 484 530
      V 562
      C 484 618, 518 652, 574 652
      H 728
      C 768 652, 800 684, 800 724
      C 800 764, 768 796, 728 796
      H 570
      C 430 796, 340 706, 340 566
      V 526
      C 340 386, 430 296, 570 296
      Z
    " transform="rotate(6 570 546)"/>

    <clipPath id="cool-clip">
      <use href="#arc-cool"/>
    </clipPath>
    <clipPath id="warm-clip">
      <use href="#arc-warm"/>
    </clipPath>

    <!-- Warm Arc Gradient: Sunlit Citrine-Gold -> Warm Coral -> Soft Rose Orchid -->
    <linearGradient id="grad-warm" x1="250" y1="220" x2="640" y2="730" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE066"/>
      <stop offset="0.42" stop-color="#FF928B"/>
      <stop offset="0.82" stop-color="#FF6FB5"/>
      <stop offset="1" stop-color="#E879F9"/>
    </linearGradient>

    <linearGradient id="rim-warm" x1="250" y1="220" x2="650" y2="730" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#FFD6E7" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Cool Arc Gradient: Mint-Aqua -> Electric Cyan-Azure -> Deep Cobalt -> Soft Lavender -->
    <linearGradient id="grad-cool" x1="760" y1="295" x2="360" y2="795" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="0.28" stop-color="#22D3EE"/>
      <stop offset="0.65" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="rim-cool" x1="360" y1="295" x2="780" y2="795" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#BAE6FD" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Optical Glass Intersection (Deep Sapphire -> Electric Violet refraction where the twin C-arcs weave) -->
    <linearGradient id="grad-intersect" x1="340" y1="340" x2="640" y2="710" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="0.52" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>

    <!-- Clean Apple HIG drop shadows -->
    <filter id="tile-shadow" x="48" y="56" width="928" height="944" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.16"/>
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>

    <filter id="warm-elevation" x="150" y="160" width="620" height="660" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#F43F5E" flood-opacity="0.18"/>
    </filter>

    <filter id="cool-elevation" x="260" y="230" width="620" height="660" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2563EB" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Outer Porcelain Squircle (macOS native IconServices provides outer drop shadow & Liquid Glass rim) -->
  <use href="#squircle" fill="url(#tile-bg)"/>

  <g clip-path="url(#squircle-clip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#tile-glow)"/>

    <!-- 1. Back C-Arc: Warm Sunlit Amber -> Coral -> Rose -->
    <g filter="url(#warm-elevation)">
      <use href="#arc-warm" fill="url(#grad-warm)" opacity="0.93"/>
      <use href="#arc-warm" stroke="url(#rim-warm)" stroke-width="3"/>
    </g>

    <!-- 2. Front C-Arc: Mint -> Electric Cyan -> Cobalt -> Violet (Translucent Glass) -->
    <g filter="url(#cool-elevation)">
      <use href="#arc-cool" fill="url(#grad-cool)" opacity="0.84"/>

      <!-- Crisp Optical Refraction Zone where Front Cool C overlaps Back Warm C -->
      <g clip-path="url(#cool-clip)">
        <use href="#arc-warm" fill="url(#grad-intersect)" opacity="0.72"/>
        <use href="#arc-warm" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="2.5"/>
      </g>

      <use href="#arc-cool" stroke="url(#rim-cool)" stroke-width="3.5"/>
    </g>
  </g>

  <use href="#squircle" stroke="url(#tile-rim)" stroke-width="2.5"/>
</svg>
